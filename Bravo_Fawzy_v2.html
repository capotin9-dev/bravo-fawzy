<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>براڤو عليك فوزي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04080f;
    --surface: #0b1220;
    --surface2: #111d30;
    --border: #1c2d45;
    --gold: #f5c842;
    --gold2: #c9971e;
    --blue: #00aaff;
    --blue2: #0077cc;
    --green: #00d47a;
    --red: #ff3d55;
    --text: #ddeeff;
    --dim: #4a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 40%, rgba(0,120,255,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 20%, rgba(245,200,66,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 90%, rgba(0,170,255,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ══ SELECTION SCREEN ══ */
  #selectionScreen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
  }

  .sel-title {
    font-size: clamp(26px, 6vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), #fff 50%, var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    animation: fadeDown 0.6s ease both;
  }

  .sel-subtitle { color: var(--dim); font-size: 16px; margin-bottom: 6px; animation: fadeDown 0.7s ease both; }
  .sel-instruction { font-size: 15px; color: var(--gold); font-weight: 700; margin-bottom: 10px; animation: fadeDown 0.8s ease both; }
  .sel-counter { font-size: 14px; color: var(--dim); margin-bottom: 20px; animation: fadeDown 0.85s ease both; }
  .sel-counter span { color: var(--blue); font-weight: 900; font-size: 18px; }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    max-width: 820px;
    width: 100%;
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease both;
  }

  .cat-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 18px 12px;
    cursor: pointer;
    transition: all 0.22s ease;
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  .cat-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.22s;
    border-radius: 14px;
  }

  .cat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

  .cat-card.selected {
    border-color: var(--gold);
    transform: translateY(-4px);
    box-shadow: 0 0 20px rgba(245,200,66,0.25);
  }

  .cat-card.selected::before { opacity: 1; background: rgba(245,200,66,0.08); }

  .cat-card.disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .cat-card.selected.disabled { opacity: 1; cursor: pointer; }

  .cat-emoji { font-size: 30px; margin-bottom: 8px; display: block; }
  .cat-name { font-size: 14px; font-weight: 700; color: var(--text); }

  .check-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    background: var(--gold);
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #000;
    font-weight: 900;
  }

  .cat-card.selected .check-badge { display: flex; }

  .start-btn {
    padding: 14px 48px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #000;
    border: none;
    border-radius: 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.4;
    pointer-events: none;
    animation: fadeUp 0.9s ease both;
  }

  .start-btn.ready { opacity: 1; pointer-events: all; box-shadow: 0 6px 24px rgba(245,200,66,0.3); }
  .start-btn.ready:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(245,200,66,0.4); }

  /* ══ GAME SCREEN ══ */
  #gameScreen { display: none; position: relative; z-index: 1; padding: 16px 10px 40px; }

  .game-title {
    font-size: clamp(20px, 4.5vw, 36px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), #fff, var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .game-subtitle { color: var(--dim); font-size: 14px; margin-bottom: 4px; }

  .hard-badge {
    display: inline-block;
    margin-bottom: 14px;
    padding: 3px 14px;
    background: rgba(255,61,85,0.15);
    border: 1px solid rgba(255,61,85,0.4);
    border-radius: 20px;
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
  }

  .scoreboard { display: flex; justify-content: center; gap: 14px; margin: 0 auto 14px; max-width: 460px; }

  .score-card {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 10px;
    cursor: pointer;
    transition: all 0.22s ease;
    position: relative;
    overflow: hidden;
  }

  .score-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.22s; }
  .score-card.team1::before { background: linear-gradient(135deg, rgba(0,170,255,0.12), transparent); }
  .score-card.team2::before { background: linear-gradient(135deg, rgba(245,200,66,0.12), transparent); }
  .score-card.active { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .score-card.team1.active { border-color: var(--blue); }
  .score-card.team2.active { border-color: var(--gold); }
  .score-card.active::before { opacity: 1; }

  .score-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; }
  .score-card.team1 .score-label { color: var(--blue); }
  .score-card.team2 .score-label { color: var(--gold); }

  .score-value { font-size: 32px; font-weight: 900; line-height: 1; }
  .score-card.team1 .score-value { color: var(--blue); }
  .score-card.team2 .score-value { color: var(--gold); }

  .active-badge { display: none; font-size: 11px; margin-top: 5px; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .score-card.team1.active .active-badge { display: inline-block; background: rgba(0,170,255,0.2); color: var(--blue); }
  .score-card.team2.active .active-badge { display: inline-block; background: rgba(245,200,66,0.2); color: var(--gold); }

  .timer-wrap {
    margin: 0 auto 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 7px 20px;
    font-size: 17px;
    font-weight: 700;
    transition: all 0.3s;
  }

  .timer-wrap.urgent { border-color: var(--red); color: var(--red); animation: pulse 0.5s infinite alternate; }
  .timer-wrap.done { border-color: var(--red); background: rgba(255,61,85,0.15); color: var(--red); }

  @keyframes pulse {
    from { box-shadow: 0 0 0 0 rgba(255,61,85,0.4); }
    to   { box-shadow: 0 0 0 8px rgba(255,61,85,0); }
  }

  .table-wrap { width: 100%; overflow-x: auto; margin: 12px 0; }

  table { width: 96%; max-width: 1000px; margin: auto; border-collapse: separate; border-spacing: 4px; }

  th {
    background: linear-gradient(180deg, #1a2540, #0f1825);
    border: 1px solid var(--border);
    padding: 10px 5px;
    font-size: clamp(10px, 1.5vw, 13px);
    font-weight: 700;
    color: var(--blue);
    border-radius: 8px;
    white-space: nowrap;
  }

  td {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: clamp(9px, 1.8vw, 16px) 6px;
    cursor: pointer;
    font-size: clamp(14px, 2.5vw, 20px);
    font-weight: 900;
    color: var(--gold);
    border-radius: 8px;
    transition: all 0.18s ease;
    user-select: none;
  }

  td:hover:not(.used) {
    background: var(--blue2);
    color: white;
    transform: scale(1.05);
    box-shadow: 0 4px 16px rgba(0,170,255,0.3);
    border-color: var(--blue);
  }

  td.used {
    background: #060c14 !important;
    color: #151f2e !important;
    cursor: not-allowed;
    transform: none !important;
    border-color: #0b1220 !important;
  }

  #questionBox {
    max-width: 680px;
    margin: 12px auto;
    padding: 22px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    min-height: 90px;
    text-align: right;
    line-height: 1.7;
    transition: all 0.3s;
  }

  .q-team { font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; padding: 3px 10px; border-radius: 20px; display: inline-block; }
  .q-team.t1 { background: rgba(0,170,255,0.15); color: var(--blue); }
  .q-team.t2 { background: rgba(245,200,66,0.15); color: var(--gold); }

  .q-text { font-size: clamp(16px, 2.6vw, 21px); font-weight: 700; color: var(--text); margin-bottom: 10px; }

  .q-answer {
    margin-top: 12px;
    padding: 11px 14px;
    background: rgba(0,212,122,0.1);
    border: 1px solid rgba(0,212,122,0.3);
    border-radius: 10px;
    color: var(--green);
    font-weight: 700;
    font-size: 15px;
    animation: fadeIn 0.35s ease;
  }

  .placeholder { color: var(--dim); font-size: 15px; padding: 16px 0; }

  @keyframes fadeIn   { from { opacity:0; transform:translateY(6px);   } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);   } to { opacity:1; transform:translateY(0); } }

  .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 10px auto; max-width: 600px; }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    font-weight: 700;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:active { transform: scale(0.96); }
  .btn-show    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-show:hover { background: #1c2d45; }
  .btn-correct { background: var(--green); color: #001a0e; }
  .btn-correct:hover { filter: brightness(1.1); box-shadow: 0 4px 16px rgba(0,212,122,0.35); }
  .btn-wrong   { background: var(--red); color: white; }
  .btn-wrong:hover { filter: brightness(1.1); box-shadow: 0 4px 16px rgba(255,61,85,0.35); }
  .btn-restart { background: var(--surface2); color: var(--gold); border: 1px solid var(--gold2); }
  .btn-restart:hover { background: rgba(245,200,66,0.1); }

  #toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 22px;
    font-size: 15px;
    font-weight: 700;
    z-index: 9999;
    transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
    white-space: nowrap;
  }

  #toast.show  { transform: translateX(-50%) translateY(0); }
  #toast.correct { border-color: var(--green); color: var(--green); }
  #toast.wrong   { border-color: var(--red);   color: var(--red);   }
</style>
</head>
<body>

<!-- ══════════════════ SELECTION SCREEN ══════════════════ -->
<div id="selectionScreen">
  <div class="sel-title">🏆 براڤو عليك فوزي</div>
  <div class="sel-subtitle">اختار 5 فئات عشان تبدأ اللعبة</div>
  <div class="sel-instruction">اضغط على الفئة عشان تختارها أو تلغيها</div>
  <div class="sel-counter">اخترت <span id="countDisplay">0</span> من 5</div>
  <div class="categories-grid" id="categoriesGrid"></div>
  <button class="start-btn" id="startBtn" onclick="startGame()">🚀 ابدأ اللعبة</button>
</div>

<!-- ══════════════════ GAME SCREEN ══════════════════ -->
<div id="gameScreen">
  <div class="game-title">🏆 براڤو عليك فوزي</div>
  <div class="game-subtitle">👋 أهلاً وسهلاً بكم في اللعبة</div>
  <div class="hard-badge">🔥 النسخة الصعبة</div>

  <div class="scoreboard">
    <div class="score-card team1" onclick="setTeam(1)" id="card1">
      <div class="score-label">فريق 1</div>
      <div class="score-value" id="score1">0</div>
      <div class="active-badge">▶ دورك</div>
    </div>
    <div class="score-card team2" onclick="setTeam(2)" id="card2">
      <div class="score-label">فريق 2</div>
      <div class="score-value" id="score2">0</div>
      <div class="active-badge">▶ دورك</div>
    </div>
  </div>

  <div class="timer-wrap" id="timerWrap">⏱️ <span id="timerVal">60</span></div>

  <div class="table-wrap">
    <table id="gameTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="questionBox">
    <div class="placeholder">اختر فريق ثم اضغط على النقاط لتبدأ اللعبة ⬆️</div>
  </div>

  <div class="actions">
    <button class="btn btn-show"    onclick="showAnswer()">📢 إظهار الإجابة</button>
    <button class="btn btn-correct" onclick="correct()">✔ صح</button>
    <button class="btn btn-wrong"   onclick="wrong()">❌ خطأ</button>
    <button class="btn btn-restart" onclick="renewQuestions()">🔄 جدد الأسئلة</button>
    <button class="btn btn-restart" onclick="goBack()">🔙 تغيير الفئات</button>
  </div>
</div>

<div id="toast"></div>

<script>

// ════════════════════════════════════════════════════════
//  POOL / RANDOM SELECTION
// ════════════════════════════════════════════════════════
let gameQuestions = {};

function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function selectQuestions() {
  gameQuestions = {};
  selectedCats.forEach(idx => {
    gameQuestions[idx] = pickRandom(allCategories[idx].questions, 5);
  });
}

// ════════════════════════════════════════════════════════
//  SELECTION LOGIC
// ════════════════════════════════════════════════════════
const MAX_SELECT = 5;
let selectedCats = [];

function buildSelectionScreen() {
  const grid = document.getElementById('categoriesGrid');
  grid.innerHTML = '';
  allCategories.forEach((cat, idx) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="check-badge">✓</div>
      <span class="cat-emoji">${cat.emoji}</span>
      <div class="cat-name">${cat.name}</div>
    `;
    card.onclick = () => toggleCat(idx, card);
    grid.appendChild(card);
  });
}

function toggleCat(idx, card) {
  const pos = selectedCats.indexOf(idx);
  if (pos !== -1) {
    selectedCats.splice(pos, 1);
    card.classList.remove('selected');
  } else {
    if (selectedCats.length >= MAX_SELECT) {
      showToast('اختار 5 فئات بس!', 'wrong');
      return;
    }
    selectedCats.push(idx);
    card.classList.add('selected');
  }
  document.getElementById('countDisplay').textContent = selectedCats.length;
  const startBtn = document.getElementById('startBtn');
  if (selectedCats.length === MAX_SELECT) {
    startBtn.classList.add('ready');
    document.querySelectorAll('.cat-card').forEach(c => {
      if (!c.classList.contains('selected')) c.classList.add('disabled');
    });
  } else {
    startBtn.classList.remove('ready');
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('disabled'));
  }
}

// ════════════════════════════════════════════════════════
//  GAME LOGIC
// ════════════════════════════════════════════════════════
let team = 0;
let timerInterval;
let timeLeft = 60;
let currentQuestion = null;
let currentPoints = 0;
let scores = { 1: 0, 2: 0 };
const POINTS = [100, 200, 300, 400, 500];

function startGame() {
  if (selectedCats.length < MAX_SELECT) return;

  team = 0;
  scores = { 1: 0, 2: 0 };
  currentQuestion = null;
  document.getElementById('score1').textContent = '0';
  document.getElementById('score2').textContent = '0';
  document.getElementById('card1').classList.remove('active');
  document.getElementById('card2').classList.remove('active');
  document.getElementById('questionBox').innerHTML = '<div class="placeholder">اختر فريق ثم اضغط على النقاط لتبدأ اللعبة ⬆️</div>';
  stopTimer();
  document.getElementById('timerWrap').className = 'timer-wrap';
  document.getElementById('timerVal').textContent = '60';

  selectQuestions();
  buildTable();
  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
}

function buildTable() {
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  head.innerHTML = '';
  body.innerHTML = '';

  const hr = document.createElement('tr');
  selectedCats.forEach(idx => {
    const th = document.createElement('th');
    th.textContent = allCategories[idx].name;
    hr.appendChild(th);
  });
  head.appendChild(hr);

  POINTS.forEach((pts, rowIdx) => {
    const tr = document.createElement('tr');
    selectedCats.forEach(idx => {
      const qData = gameQuestions[idx][rowIdx];
      const td = document.createElement('td');
      td.textContent = pts;
      td.dataset.q = qData.q;
      td.dataset.a = qData.a;
      td.dataset.pts = pts;
      td.onclick = function() { askQuestion(this); };
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function askQuestion(cell) {
  if (team === 0) { showToast('اختر فريق أولاً!', 'wrong'); return; }
  if (cell.classList.contains('used')) return;
  if (currentQuestion !== null) { showToast('⚠️ أجب على السؤال الحالي أولاً!', 'wrong'); return; }

  currentQuestion = { q: cell.dataset.q, a: cell.dataset.a };
  currentPoints = parseInt(cell.dataset.pts);

  cell.classList.add('used');
  cell.onclick = null;

  const teamClass = team === 1 ? 't1' : 't2';
  document.getElementById('questionBox').innerHTML = `
    <div class="q-team ${teamClass}">فريق ${team} • ${currentPoints} نقطة</div>
    <div class="q-text">${currentQuestion.q}</div>
  `;

  startTimer();
}

function setTeam(t) {
  team = t;
  document.getElementById('card1').classList.toggle('active', t === 1);
  document.getElementById('card2').classList.toggle('active', t === 2);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.stop(ctx.currentTime + 0.12);
  } catch (e) { /* audio not supported */ }
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 60;
  const wrap = document.getElementById('timerWrap');
  const val  = document.getElementById('timerVal');
  wrap.className = 'timer-wrap';
  val.textContent = timeLeft;

  timerInterval = setInterval(() => {
    timeLeft--;
    val.textContent = timeLeft;
    if (timeLeft <= 10 && timeLeft > 0) { wrap.className = 'timer-wrap urgent'; beep(); }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      wrap.className = 'timer-wrap done';
      val.textContent = '0';
      showToast('⛔ انتهى الوقت!', 'wrong');
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerWrap').className = 'timer-wrap';
}

function showAnswer() {
  if (!currentQuestion) return;
  stopTimer();
  const box = document.getElementById('questionBox');
  const existing = box.querySelector('.q-answer');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'q-answer';
  div.innerHTML = '📢 الإجابة: ' + currentQuestion.a;
  box.appendChild(div);
}

function soundWin() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.2);
      osc.start(ctx.currentTime + i * 0.1);
      osc.stop(ctx.currentTime + i * 0.1 + 0.2);
    });
  } catch (e) {}
}

function soundLose() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [330, 262, 196, 165].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sawtooth';
      gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.25);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.25);
    });
  } catch (e) {}
}

function correct() {
  if (!currentQuestion) return;
  soundWin();
  stopTimer();
  scores[team] += currentPoints;
  document.getElementById('score' + team).textContent = scores[team];
  showToast(`✔ صح! +${currentPoints} نقطة لفريق ${team}`, 'correct');
  currentQuestion = null;
  team = team === 1 ? 2 : 1;
  setTeam(team);
}

function wrong() {
  if (!currentQuestion) return;
  soundLose();
  stopTimer();
  scores[team] -= currentPoints;
  document.getElementById('score' + team).textContent = scores[team];
  showToast(`❌ خطأ! -${currentPoints} من فريق ${team}`, 'wrong');
  currentQuestion = null;
  team = team === 1 ? 2 : 1;
  setTeam(team);
}

function renewQuestions() {
  selectQuestions();
  buildTable();
  team = 0;
  scores = { 1: 0, 2: 0 };
  currentQuestion = null;
  document.getElementById('score1').textContent = '0';
  document.getElementById('score2').textContent = '0';
  document.getElementById('card1').classList.remove('active');
  document.getElementById('card2').classList.remove('active');
  document.getElementById('questionBox').innerHTML = '<div class="placeholder">اختر فريق ثم اضغط على النقاط لتبدأ اللعبة ⬆️</div>';
  stopTimer();
  document.getElementById('timerWrap').className = 'timer-wrap';
  document.getElementById('timerVal').textContent = '60';
  showToast('🔄 تم تجديد الأسئلة للفئات المختارة!', 'correct');
}

function goBack() {
  stopTimer();
  currentQuestion = null;
  selectedCats = [];
  document.getElementById('countDisplay').textContent = '0';
  document.getElementById('startBtn').classList.remove('ready');
  document.querySelectorAll('.cat-card').forEach(c => {
    c.classList.remove('selected', 'disabled');
  });
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('selectionScreen').style.display = 'flex';
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => { t.className = ''; }, 2800);
}

buildSelectionScreen();
